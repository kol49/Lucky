[project]
name = "profitmap"
version = "0.1.0"
description = "Desktop profitability analysis and break-even planning application for entrepreneurs."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "pyqtgraph>=0.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
forecasting = ["scikit-learn>=1.5", "xgboost>=2.0", "prophet>=1.1"]
desktop = ["PySide6>=6.7", "pyqtgraph>=0.13"]

[tool.pyinstaller]
name = "ProfitMap"
