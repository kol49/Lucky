name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ProfitMap.exe
        run: pyinstaller --onefile --windowed --name ProfitMap --paths src --hidden-import PySide6.QtSvg --hidden-import pyqtgraph main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ProfitMap-Windows-EXE
          path: dist/ProfitMap.exe
