limit_req_zone $binary_remote_addr zone=profitmap_global:20m rate=120r/m;
limit_req_zone $binary_remote_addr zone=profitmap_api:20m rate=120r/m;
limit_req_zone $binary_remote_addr zone=profitmap_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=profitmap_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 153.75.246.33;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _ 153.75.246.33;

    ssl_certificate /etc/ssl/certs/profitmap-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/profitmap-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;
    limit_conn profitmap_conn 20;
    limit_req zone=profitmap_global burst=60 nodelay;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    location = /login {
        limit_req zone=profitmap_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        limit_req zone=profitmap_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
